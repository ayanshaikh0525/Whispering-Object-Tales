
name: YouTube Publisher

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SOURCE_FOLDER_ID: ${{ secrets.SOURCE_FOLDER_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cache Python packages
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Cache Faster-Whisper model
      - name: Cache Hugging Face Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-faster-whisper-small-v3

      - name: Debug Cache
        run: |
          ls -R ~/.cache/huggingface || true
    
      - name: Remove broken Chrome repo
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Auth Directory
        run: mkdir -p auth

      - name: Create Service Account File
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" | base64 -d > auth/service_account.json
          echo "${{ secrets.SOURCE_FOLDER_ID }}"

      - name: Create OAuth Credentials
        run: |
          echo "${{ secrets.YOUTUBE_CLIENT_SECRET }}" | base64 -d > auth/client_secret.json

      - name: Restore YouTube Token
        run: |
          echo "${{ secrets.YOUTUBE_TOKEN_JSON }}" | base64 -d > auth/token.json

      - name: Verify HF Token
        run: |
          python -c "import os; print('HF_TOKEN Found:', bool(os.getenv('HF_TOKEN')))"

      - name: Download Faster-Whisper Model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python <<EOF
          from huggingface_hub import snapshot_download
          import os
      
          snapshot_download(
              repo_id="Systran/faster-whisper-small",
              cache_dir=os.path.expanduser("~/.cache/huggingface"),
              token=os.environ["HF_TOKEN"]
          )
      
          print("Model downloaded successfully.")
          EOF
    
      - name: Run Publisher
        run: |
          cd workers
          python publish_youtube.py

      - name: Commit Updated JSON
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/master_videos.json

          git diff --cached --quiet || \
          git commit -m "Update video publishing status"

      - name: Push Changes
        run: |
          git push
